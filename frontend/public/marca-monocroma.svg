<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Roomies San Carlos">
  <!--
    La version monocroma del favicon.

    Un unico color y sin detalles que dependan del fondo. Va en
    `currentColor` para que el navegador lo pinte del color del texto
    del sistema --los iconos adaptativos de Android lo hacen asi-- y
    por eso el resto de la marca si lleva los hex fijos.

    Sin las dos ventanas: a 16 px se convierten en un punto gris y la
    casa deja de leerse como casa. La version monocroma es el logo
    reducido, no el logo con los colores quitados.
  -->
