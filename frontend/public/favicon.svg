<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    El favicon.

    A 16 px --que es como lo pinta el navegador-- caben la casa y las
    dos ventanas, y ya. Sin la hoja: a ese tamano es un punto verde
    que solo resta contraste al techo.

    Va con el color fijo porque un favicon no hereda `currentColor`
    del sitio; el navegador lo pide por URL y lo pinta como sea.
  -->
  <path fill="#1b4332" d="M16 3.2 3.2 13.6a1.6 1.6 0 0 0 1 3V27a1.8 1.8 0 0 0 1.8 1.8h20A1.8 1.8 0 0 0 27.8 27v-10.4a1.6 1.6 0 0 0 1-3L16 3.2Z"/>
  <rect fill="#fdfbf7" x="9" y="16" width="5.5" height="5.5" rx="1"/>
  <rect fill="#fdfbf7" x="17.5" y="16" width="5.5" height="5.5" rx="1"/>
</svg>