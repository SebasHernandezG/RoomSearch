name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores del mismo PR para no desperdiciar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: roomies_testing
          MYSQL_USER: roomies
          MYSQL_PASSWORD: roomies
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, exif, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Instalar dependencias
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copiar .env de ejemplo
        working-directory: backend
        run: cp .env.example .env

      - name: Generar APP_KEY
        working-directory: backend
        run: php artisan key:generate --force

      - name: Pint (formato)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Tests
        working-directory: backend
        run: php artisan test

      - name: Auditoria de dependencias
        working-directory: backend
        run: composer audit --no-interaction
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier
        working-directory: frontend
        run: npm run format:check

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets:
    name: Avisar sobre secretos filtrados
    runs-on: ubuntu-latest
    # Solo corre si alguien empuja un patron de secreto conocido.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar archivos .env versionados
        run: |
          if git ls-files --error-unmatch .env backend/.env frontend/.env >/dev/null 2>&1; then
            echo "::error::Hay un .env en el repositorio. Revocalo si tiene secretos."
            exit 1
          fi
          echo "OK: ningun .env versionado"

      - name: Buscar claves de Google filtradas
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ':!*.md'; then
            echo "::error::Posible clave de API de Google en el repositorio."
            exit 1
          fi
          echo "OK: sin claves de API de Google"
