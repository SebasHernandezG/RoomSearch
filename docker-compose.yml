services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: roomies
      MYSQL_USER: roomies
      MYSQL_PASSWORD: roomies
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
volumes:
  mysql-data:
